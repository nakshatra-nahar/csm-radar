[project]
name = "radar"
version = "0.1.0"
description = "Multi-tenant CSM risk worklist"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "itsdangerous",
    "python-multipart",
    "psycopg[binary]>=3.2.10",
    "psycopg-pool>=3.2",
    "numpy",
    "pandas",
    "scikit-learn",
    "pyarrow",
    "pydantic>=2",
    "anthropic>=1.15,<2",
    "markdown",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: generates and replays a world (deselect with -m \"not slow\")",
    "live_llm: calls the real Anthropic API (opt in with -m live_llm)",
]
addopts = "-m 'not live_llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
