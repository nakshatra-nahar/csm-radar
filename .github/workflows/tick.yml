# Runs the worker on Vercel every 15 minutes (Ruling Y): POST /internal/tick with the bearer.
# Needs repository secrets RADAR_URL (https://<project>.vercel.app) and TICK_SECRET.
# GitHub can start a schedule late and pauses it after 60 days without repository activity;
# the daily Vercel cron in vercel.json is the backstop.
name: tick
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions: {}

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - env:  # secrets reach the script as variables, never spliced into its text
          RADAR_URL: ${{ secrets.RADAR_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -z "$RADAR_URL" ]; then
            echo "::notice::RADAR_URL and TICK_SECRET are not set yet (docs/deploy.md step A8); skipping the tick"
            exit 0
          fi
          curl -fsS --max-time 290 -X POST -H "Authorization: Bearer $TICK_SECRET" "$RADAR_URL/internal/tick"
